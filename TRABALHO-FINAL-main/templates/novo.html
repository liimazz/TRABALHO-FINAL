{% extends "base.html" %}

{% block titulo %}
Novo Aviso - MuralTech
{% endblock %}

{% block conteudo %}
<div class="container py-5 fade-up">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="form-container">

                <div class="text-center mb-4">
                    <i class="bi bi-plus-circle-fill display-4 text-primary"></i>
                    <h2 class="fw-bold mt-3">Criar Novo Aviso</h2>
                    <p class="text-muted">Preencha os campos abaixo para publicar um novo comunicado.</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="bi bi-type"></i> Título
                        </label>
                        <input type="text" name="titulo" class="form-control"
                               placeholder="Ex: Prova de Matemática" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            <i class="bi bi-tags-fill"></i> Categoria
                        </label>
                        <select name="categoria" class="form-select" required>
                            <option value="" disabled selected>Selecione uma categoria...</option>
                            {% for cat in categorias %}
                            <option value="{{ cat }}">{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            <i class="bi bi-card-text"></i> Descrição
                        </label>
                        <textarea name="descricao" rows="5" class="form-control"
                                  placeholder="Escreva a mensagem do aviso..." required></textarea>
                    </div>

                    <div class="mb-4 form-check">
                        <input class="form-check-input" type="checkbox" name="fixado" id="fixado">
                        <label class="form-check-label" for="fixado">
                            <i class="bi bi-pin-angle-fill text-warning"></i>
                            Fixar este aviso no topo
                        </label>
                    </div>

                    <div class="d-flex justify-content-between flex-wrap gap-2">
                        <a href="{{ url_for('avisos') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left-circle"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle-fill"></i> Publicar Aviso
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
